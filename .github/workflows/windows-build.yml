name: Build and test

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        preset: [portable-debug, portable-release]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build libpng-dev libjpeg-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Validate controlled fixtures
        run: python3 scripts/validate-fixture-manifest.py build/${{ matrix.preset }}/DaedalusAssetValidator

  windows-vs2022:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Debug
        run: cmake --preset windows-msvc-debug
      - name: Build Debug
        run: cmake --build --preset windows-msvc-debug
      - name: Test Debug
        run: ctest --preset windows-msvc-debug
      - name: Validate Debug controlled fixtures
        run: python scripts/validate-fixture-manifest.py build/windows-msvc-debug/Debug/DaedalusAssetValidator.exe
      - name: Configure Release
        run: cmake --preset windows-msvc-release
      - name: Build Release
        run: cmake --build --preset windows-msvc-release
      - name: Test Release
        run: ctest --preset windows-msvc-release
      - name: Validate Release controlled fixtures
        run: python scripts/validate-fixture-manifest.py build/windows-msvc-release/Release/DaedalusAssetValidator.exe
